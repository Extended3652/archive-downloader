[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-downloader"
version = "0.1.0"
description = "Python wrappers around the Internet Archive ia CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "internetarchive>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
ia-audit = "ia_audit:main"
ia-dl = "ia_dl:main"
ia-easy = "ia_easy:cli_main"
ia-minotaur = "ia_minotaur:cli_main"
ia-config = "ia_config_cli:main"
ia-radarr = "ia_radarr_cli:main"

[tool.setuptools]
py-modules = [
  "ia_audit",
  "ia_api",
  "ia_config",
  "ia_config_cli",
  "ia_common",
  "ia_dl",
  "ia_downloads",
  "ia_dvd",
  "ia_easy",
  "ia_bazarr",
  "ia_jellyfin",
  "ia_minotaur",
  "ia_minotaur_events",
  "ia_organize",
  "ia_paths",
  "ia_radarr",
  "ia_radarr_cli",
  "ia_state",
  "yt_api",
  "yt_downloads",
]
